name: Build Zankai Updater

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zankai-updater-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "true"

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.4xx"

      - name: Resolve build version
        run: |
          set -euo pipefail
          version="$(dotnet msbuild RulesetUpdater/RulesetUpdater.csproj -nologo -getProperty:Version | tr -d '\r')"
          informational_version="${version}-ci.${GITHUB_RUN_NUMBER}"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            informational_version="${GITHUB_REF_NAME#v}"
            version="$informational_version"
            # Preserve letter-suffixed release names while giving NuGet a valid version.
            if [[ "$version" =~ ^([0-9]+\.[0-9]+\.[0-9]+)([a-z]+)(\+[0-9A-Za-z.-]+)?$ ]]; then
              version="${BASH_REMATCH[1]}-${BASH_REMATCH[2]}${BASH_REMATCH[3]}"
            fi
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
              printf 'Unsupported release tag: %s\n' "$GITHUB_REF_NAME" >&2
              exit 1
            fi
          fi
          printf 'BUILD_VERSION=%s\nINFORMATIONAL_VERSION=%s\n' "$version" "$informational_version" >> "$GITHUB_ENV"

      - name: Build ruleset DLL
        run: |
          dotnet build osu.Game.Rulesets.Updater/osu.Game.Rulesets.Updater.csproj \
            --configuration Release \
            -p:Version="$BUILD_VERSION" \
            -p:InformationalVersion="$INFORMATIONAL_VERSION" \
            -p:IncludeSourceRevisionInInformationalVersion=false

      - name: Publish standalone Windows EXE
        run: |
          dotnet publish RulesetUpdater/RulesetUpdater.csproj \
            --configuration Release --runtime win-x64 --self-contained true \
            --output artifacts/helper \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:DebugType=embedded \
            -p:Version="$BUILD_VERSION" \
            -p:InformationalVersion="$INFORMATIONAL_VERSION" \
            -p:IncludeSourceRevisionInInformationalVersion=false

      - name: Package and smoke-test
        run: |
          set -euo pipefail
          mkdir -p artifacts/package
          cp osu.Game.Rulesets.Updater/bin/Release/net8.0/osu.Game.Rulesets.ZankaiUpdater.dll artifacts/package/
          cp artifacts/helper/ZankaiUpdater.exe artifacts/package/
          test -s artifacts/package/osu.Game.Rulesets.ZankaiUpdater.dll
          test -s artifacts/package/ZankaiUpdater.exe
          # Run from the package, without loose runtime or dependency files beside it.
          ./artifacts/package/ZankaiUpdater.exe --help | tee artifacts/helper-help.txt
          grep -q '^Zankai Updater' artifacts/helper-help.txt

      - name: Upload DLL and EXE
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ZankaiUpdater-win-x64
          path: artifacts/package/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish tagged release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download packaged build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ZankaiUpdater-win-x64
          path: artifacts/package

      - name: Publish DLL and EXE
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          extra_args=()
          release_version="${RELEASE_TAG#v}"
          if [[ "${release_version%%+*}" == *-* ]]; then
            extra_args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" \
            artifacts/package/osu.Game.Rulesets.ZankaiUpdater.dll \
            artifacts/package/ZankaiUpdater.exe \
            --verify-tag \
            --title "Zankai Updater $RELEASE_TAG" \
            --notes $'Windows x64\n\nPlace both files in your osu! rulesets folder' \
            "${extra_args[@]}"
